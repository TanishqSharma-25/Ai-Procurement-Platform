version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corvo
      POSTGRES_PASSWORD: corvo
      POSTGRES_DB: corvo_procurement
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvo -d corvo_procurement"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://corvo:corvo@db:5432/corvo_procurement
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts && npm run start"
